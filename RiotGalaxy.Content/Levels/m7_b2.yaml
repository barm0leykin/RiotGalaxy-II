# Корован — конвой. Камикадзе с двух сторон одновременно + строй тяжёлых.
# Здесь игрок впервые встречает ЭЛИТУ — бронированного конвойного (золотое свечение, ×3 HP).
description: "Корован — конвой"
spawnInterval: 0.4
sortie: true
sortieInterval: 3
sortieCount: 2
events:
  - parallel:
      - - { enemy: kamik, count: 4, route: cross-left, after: scatter }
      - - { enemy: kamik, count: 4, route: cross-right, after: scatter }
  - { enemy: heavy, count: 3, formation: true }
  - { enemy: heavy, count: 1, elite: true, drop: hp }
