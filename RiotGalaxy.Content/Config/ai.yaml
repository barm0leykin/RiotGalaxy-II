# Параметры ИИ врагов и боссов (раньше — константы в коде). Правится без пересборки.
# Углы курса: 0 = вверх, 90 = вправо, 180 = вниз. Игра работает и без файла (дефолты в AiConfig).

common:
  swarmZoneFrac: 0.3     # зона роения: враг «влетел» после этой доли высоты экрана сверху
  ideaInterval: 3.0      # период «новой идеи» состояния (смена курса), сек

states:
  takeoff:  { courseMinDeg: 135, courseMaxDeg: 225 }  # влёт: курс вниз с разбросом
  swarming: { speedFrac: 0.2 }                        # роение: доля от MaxSpeed
  attack:   { courseMinDeg: 155, courseMaxDeg: 205 }  # атака: курс круче вниз

red:
  swarmShootInterval: 6.0    # красный в роении стреляет раз в N сек

blue:
  swarmShootInterval: 8.0    # синий в роении
  attackShootInterval: 3.0   # синий в атаке
  attackChance: 0.2          # шанс сорваться из роения в атаку на каждой «идее» (0..1)

# Вылеты из улья (sortie): форма каждой тактики пике. Доли (…Frac) — от attackSpeed врага.
sortie:
  maxDiveTime: 9.0                 # страховка: сек в пике до принудительного возврата
  snake:     { amplitude: 100, descendFrac: 0.85, waveSpeedFrac: 0.5 }
  ellipse:   { radius: 110, descendFrac: 0.3 }
  zigzag:    { amplitude: 90, descendFrac: 0.85, waveSpeedFrac: 0.6 }
  spiral:    { startRadius: 34, radiusGrow: 65, omegaDivisor: 85, descendFrac: 0.55 }
  swoop:     { sideFrac: 0.7, downFrac: 0.4, accelFrac: 1.3 }
  strafe:    { turnYFrac: 0.42 }   # до этой доли высоты спускаемся, потом штурмуем поперёк
  homing:    { turnSpeed: 2.2 }    # рад/сек — скорость доворота на игрока
  boomerang: { sideFrac: 0.35, downFrac: 0.9, brakeFrac: 1.15 }
  random:    { courseMinDeg: 155, courseMaxDeg: 205 }

# Улей (формация): барражирование и готовность к вылету.
hive:
  swayAmplitude: 70      # качание всего улья по X, пикс
  swaySpeed: 1.0         # рад/сек
  settleRadius: 50       # юнит «осел» возле ячейки (готов к вылету), пикс
  defaultSortieInterval: 4.0   # дефолты, если бой не задал sortieInterval/sortieCount
  defaultSortieCount: 1

# ─── БОССЫ ────────────────────────────────────────────────────────────────────
# У каждого босса свой конфиг (bosses.<тип из enemies.yaml>); незаданное — из bossDefault.
#
# Фазы (phases) — список от полного HP к низкому. Фаза активна, пока hpFrac > hpAbove
# (у последней hpAbove: 0). У каждой фазы:
#   attackInterval — пауза между залпами, сек;  sweepSpeed — скорость свипа
#   shellSpeed / shellDamage — «оружие фазы»: скорость/урон снаряда (0 — не менять)
#   addsCount / addsType     — подмога при входе в фазу (тип — имя из enemies.yaml)
#   attacks — список паттернов одного залпа (исполняются все разом):
#     { type: aimedBurst, count: N, spreadDeg: S } — очередь вокруг направления на игрока (шаг S)
#     { type: fanDown,    count: N, spreadDeg: S } — веер вниз полной шириной S
#     { type: radial,     count: N }               — залп по кругу
#     { type: spiral,     count: N, spreadDeg: S } — вращающаяся серия (шаг S за снаряд; задать shotDelay!)
#     { type: weapon, weaponId: id, count: N }     — стрелять оружием из weapons.yaml:
#           minigun → очередь с разбросом, laser → пробивающие лучи, spread → веера (спрайт оружия)
#     { type: aimedShot }                          — одиночный прицельный
#   shotDelay: T — «волна»: снаряды паттерна выходят ПООЧЕРЁДНО с интервалом T сек
#           (fanDown+shotDelay = веер-волна слева направо, radial+shotDelay = вертушка)
bossDefault:
  hoverYFrac: 0.18       # точка зависания (доля высоты экрана)
  centerXFrac: 0.5       # центр свипа (доля ширины)
  sweepAmpFrac: 0.32     # амплитуда свипа (доля ширины)
  entrySpeed: 90         # скорость влёта, пикс/сек
  firstAttackDelay: 1.2  # пауза перед первой атакой, сек
  telegraphTime: 0.6     # вспышка-предупреждение перед залпом, сек
  phaseAttackDelay: 0.6  # пауза до атаки после смены фазы
  bobAmplitude: 18       # вертикальное покачивание, пикс
  bobSpeed: 0.6          # частота покачивания
  addsOffsetX: 70        # разлёт подмоги от центра босса, пикс
  phases:
    - hpAbove: 0.66
      attackInterval: 2.2
      sweepSpeed: 0.8
      attacks:
        - { type: aimedBurst, count: 3, spreadDeg: 10 }
    - hpAbove: 0.33
      attackInterval: 1.8
      sweepSpeed: 1.2
      attacks:
        - { type: fanDown, count: 7, spreadDeg: 110 }
        - { type: aimedShot }
    - hpAbove: 0
      attackInterval: 1.4
      sweepSpeed: 1.7
      addsCount: 2
      attacks:
        - { type: radial, count: 12 }

bosses:
  # m1–m4, Акт I: яхта Зонального — «классика» (дефолтные фазы), чуть медленнее.
  boss:
    phases:
      - { hpAbove: 0.66, attackInterval: 2.4, sweepSpeed: 0.8,
          attacks: [ { type: aimedBurst, count: 3, spreadDeg: 10 } ] }
      - { hpAbove: 0.33, attackInterval: 2.0, sweepSpeed: 1.1,
          attacks: [ { type: fanDown, count: 7, spreadDeg: 110 }, { type: aimedShot } ] }
      - { hpAbove: 0, attackInterval: 1.6, sweepSpeed: 1.5, addsCount: 2, addsType: scout,
          attacks: [ { type: radial, count: 10 } ] }

  # m9, финал Акта II: полевой командир укропитеков — агрессивные веера, подмога камикадзе.
  ukroboss:
    sweepAmpFrac: 0.38
    phases:
      - { hpAbove: 0.7, attackInterval: 2.0, sweepSpeed: 1.0,
          attacks: [ { type: aimedFan, count: 5, spreadDeg: 14 } ] }
      - { hpAbove: 0.4, attackInterval: 1.7, sweepSpeed: 1.3, addsCount: 2, addsType: kamik,
          attacks: [ { type: fanDown, count: 9, spreadDeg: 130 } ] }
      - { hpAbove: 0, attackInterval: 1.3, sweepSpeed: 1.8, addsCount: 3, addsType: kamik, shellSpeed: 290,
          attacks: [ { type: radial, count: 10 },
                     { type: weapon, weaponId: minigun, count: 6, shotDelay: 0.09 } ] }

  # m11: флагман Трапизон (DJ Trapp) — широкие медленные веера-«стена», мало манёвра.
  trapp:
    sweepAmpFrac: 0.22
    bobAmplitude: 10
    telegraphTime: 0.8
    phases:
      - { hpAbove: 0.66, attackInterval: 2.6, sweepSpeed: 0.6, shellSpeed: 200,
          attacks: [ { type: fanDown, count: 11, spreadDeg: 150 } ] }
      - { hpAbove: 0.33, attackInterval: 2.2, sweepSpeed: 0.8, shellSpeed: 220,
          attacks: [ { type: fanDown, count: 13, spreadDeg: 160, shotDelay: 0.05 }, { type: aimedShot } ] }
      - { hpAbove: 0, attackInterval: 1.8, sweepSpeed: 1.0, addsCount: 2, addsType: korma, shellSpeed: 240,
          attacks: [ { type: fanDown, count: 15, spreadDeg: 170, shotDelay: 0.06 },
                     { type: aimedBurst, count: 3, spreadDeg: 12 } ] }

  # m12: бризанский «Жнец» — быстрый и вертлявый, прицельные очереди + радиалы, подмога briz.
  reaper:
    sweepAmpFrac: 0.4
    bobAmplitude: 26
    bobSpeed: 0.9
    telegraphTime: 0.5
    phases:
      - { hpAbove: 0.7, attackInterval: 1.8, sweepSpeed: 1.4, shellSpeed: 300,
          attacks: [ { type: aimedBurst, count: 4, spreadDeg: 8 } ] }
      - { hpAbove: 0.4, attackInterval: 1.5, sweepSpeed: 1.7, addsCount: 2, addsType: briz, shellSpeed: 320,
          attacks: [ { type: aimedBurst, count: 5, spreadDeg: 9 }, { type: radial, count: 8 } ] }
      - { hpAbove: 0, attackInterval: 1.6, sweepSpeed: 2.1, shellSpeed: 340,
          attacks: [ { type: spiral, count: 16, spreadDeg: 40, shotDelay: 0.06 }, { type: aimedShot } ] }

  # m13, финал кампании: Сверхразум J-D-bI — 4 ФАЗЫ, всё сразу и жирнее к концу.
  overmind:
    sweepAmpFrac: 0.36
    telegraphTime: 0.7
    firstAttackDelay: 1.5
    phases:
      - { hpAbove: 0.75, attackInterval: 2.2, sweepSpeed: 0.9,
          attacks: [ { type: aimedBurst, count: 3, spreadDeg: 10 } ] }
      - { hpAbove: 0.5, attackInterval: 1.8, sweepSpeed: 1.2, addsCount: 2, addsType: briz,
          attacks: [ { type: fanDown, count: 9, spreadDeg: 120 }, { type: aimedShot } ] }
      - { hpAbove: 0.25, attackInterval: 1.5, sweepSpeed: 1.6, addsCount: 2, addsType: korma, shellSpeed: 300,
          attacks: [ { type: radial, count: 12 },
                     { type: weapon, weaponId: laser, count: 2, shotDelay: 0.3 } ] }
      - { hpAbove: 0, attackInterval: 1.4, sweepSpeed: 2.0, addsCount: 2, addsType: kamik,
          shellSpeed: 330, shellDamage: 14,
          attacks: [ { type: radial, count: 16, shotDelay: 0.04 },
                     { type: weapon, weaponId: laser, count: 3, shotDelay: 0.25 } ] }
