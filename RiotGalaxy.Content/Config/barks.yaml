# Barks — короткие реплики пилота в бою, по триггерам. Показываются через MessageLog (тост-лог),
# НЕ прерывают игру. Ключ = триггер, значение = список фраз (берётся случайная, без повтора подряд).
# Тон — как у сеттинга: сатира, бравада, «космический шутер про бунтарей». Правится без пересборки.

# Здоровье упало ниже трети
lowHp:
  - "Корпус трещит!"
  - "Ещё держусь… кажется."
  - "Медик мне не по карману!"
  - "Красная лампочка — это плохо?"

# Активирована бомба (нюк)
nuke:
  - "Всем лежать!"
  - "Ядрёна бомба пошла!"
  - "Расступись, черти!"

# Зона зачищена (волна/бой)
waveCleared:
  - "Чисто. Кто следующий?"
  - "Зона наша!"
  - "И это всё, на что вы способны?"

# Появился босс
bossAppear:
  - "Ого, крупная рыба."
  - "Это ещё что за корыто?"
  - "Большой — значит, неповоротливый."

# Игрок получил урон (изредка)
playerHit:
  - "Ай! Это будет вычтено из премии."
  - "Царапина."
  - "Эй, поаккуратнее!"

# Начало боя
battleStart:
  - "Поехали!"
  - "Ну, с богом… и с бластером."
  - "Работаем."

# Серия убийств без попаданий (килстрик)
killStreak:
  - "Вот это я понимаю!"
  - "Кто ещё хочет премию?"
  - "Так, статистику потом посчитаем."
  - "На лом их, на лом!"

# Подобран бонус-бафф (урон/скорость/бомба/аптечка)
bonusGrab:
  - "О, полезное!"
  - "Апгрейд не помешает."
  - "Спасибо, не откажусь."

# Босс перешёл в новую фазу (разозлился)
bossPhase:
  - "Ого, он разозлился."
  - "Кажется, я его достал."
  - "Не нравится? То ли ещё будет!"
